name: Build Locket Photobooth Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies & Capacitor Android
        run: |
          npm install
          npm install --no-save @capacitor/android@^6.2.0

      - name: Generate & sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/configure-android.js

      - name: Build installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Locket-Photobooth.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Locket-Photobooth-APK
          path: android/Locket-Photobooth.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Locket Photobooth Android APK (Mới nhất)"
          body: "Bản cài đặt Android (.apk) tự động cập nhật giao diện & tính năng từ Locket Studio."
          prerelease: false
          make_latest: true
          files: android/Locket-Photobooth.apk
